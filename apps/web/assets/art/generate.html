<!doctype html>
<!--
  Draws the site's art: peonies out of focus, in the brand's plum and rose, with
  scan lines and grain. Open this file in a browser and save each image, or serve
  it with a server that accepts PUT and add ?save to write them all.
  Everything is seeded, so the images come out the same every time.
-->
<meta charset="utf-8" />
<title>Peony art</title>
<style>
  body { margin: 24px; background: #171415; color: #f2eff0; font: 14px system-ui; }
  figure { margin: 0 0 32px; }
  canvas { display: block; max-width: 100%; height: auto; border-radius: 8px; }
  a { color: #e07c98; }
</style>
<main id="out"></main>
<script>
  const random = (seed) => () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  // One petal pointing up from the origin: narrow at the base, a broad rounded crown.
  const petal = (ctx, length, width) => {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(width * 0.2, -length * 0.15, width * 0.5, -length * 0.4, width * 0.5, -length * 0.66);
    ctx.bezierCurveTo(width * 0.5, -length * 1.08, -width * 0.5, -length * 1.08, -width * 0.5, -length * 0.66);
    ctx.bezierCurveTo(-width * 0.5, -length * 0.4, -width * 0.2, -length * 0.15, 0, 0);
    ctx.closePath();
  };

  // A double peony from above: rings of petals, each ring smaller, paler and turned a little.
  const bloom = (ctx, rand, { x, y, radius, turn = 0, warmth = 0, tilt = 1 }) => {
    const rings = [
      { count: 8, scale: 1, base: [122, 46, 74], edge: [200, 92, 124] },
      { count: 8, scale: 0.8, base: [160, 61, 92], edge: [224, 124, 152] },
      { count: 7, scale: 0.6, base: [200, 92, 124], edge: [240, 180, 198] },
      { count: 6, scale: 0.42, base: [224, 124, 152], edge: [251, 230, 236] },
      { count: 5, scale: 0.24, base: [240, 180, 198], edge: [255, 244, 240] },
    ];
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1, tilt);
    rings.forEach((ring, index) => {
      const length = radius * ring.scale;
      const width = length * (1.05 - index * 0.06);
      for (let i = 0; i < ring.count; i++) {
        const angle = turn + index * 0.4 + (i / ring.count) * Math.PI * 2 + (rand() - 0.5) * 0.18;
        ctx.save();
        ctx.rotate(angle);
        const reach = length * (0.92 + rand() * 0.16);
        const fill = ctx.createLinearGradient(0, 0, 0, -reach);
        const mix = (a, b) => a.map((v, k) => Math.round(v + (b[k] - v) * warmth));
        const base = mix(ring.base, [180, 83, 42]);
        const edge = mix(ring.edge, [255, 214, 170]);
        fill.addColorStop(0, `rgb(${base.map((v) => Math.round(v * 0.4))})`);
        fill.addColorStop(0.55, `rgb(${base})`);
        fill.addColorStop(1, `rgb(${edge})`);
        ctx.fillStyle = fill;
        ctx.shadowColor = "rgba(28, 13, 18, 0.7)";
        ctx.shadowBlur = radius * 0.07;
        petal(ctx, reach, width);
        ctx.fill();
        ctx.restore();
      }
    });
    const heart = ctx.createRadialGradient(0, 0, 0, 0, 0, radius * 0.16);
    heart.addColorStop(0, "rgba(255, 221, 160, 0.95)");
    heart.addColorStop(1, "rgba(232, 139, 94, 0)");
    ctx.fillStyle = heart;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.16, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  const glow = (ctx, x, y, radius, color) => {
    const fill = ctx.createRadialGradient(x, y, 0, x, y, radius);
    fill.addColorStop(0, color);
    fill.addColorStop(1, "rgba(0, 0, 0, 0)");
    ctx.fillStyle = fill;
    ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
  };

  // Each layer is drawn on its own canvas so it can sit at its own depth of focus.
  const layer = (target, blur, draw) => {
    const canvas = new OffscreenCanvas(target.canvas.width, target.canvas.height);
    draw(canvas.getContext("2d"));
    target.save();
    target.filter = `blur(${blur}px)`;
    target.drawImage(canvas, 0, 0);
    target.restore();
  };

  // Scan lines, a sideways smear that changes from row to row, grain, and a vignette.
  const develop = (ctx, rand, strength) => {
    const { width, height } = ctx.canvas;
    const image = ctx.getImageData(0, 0, width, height);
    const source = new Uint8ClampedArray(image.data);
    const data = image.data;
    let drift = 0;
    for (let y = 0; y < height; y++) {
      drift = drift * 0.86 + (rand() - 0.5) * strength * 0.005 * width;
      const smear = Math.max(1, Math.round((0.4 + rand()) * strength * 0.005 * width));
      const line = 0.86 + 0.14 * Math.sin((y / height) * Math.PI * (height / 3.2));
      const shade = 1 - 0.55 * Math.pow(Math.abs(y / height - 0.5) * 2, 3);
      for (let x = 0; x < width; x++) {
        let r = 0, g = 0, b = 0;
        for (let k = 0; k < smear; k++) {
          const from = Math.min(width - 1, Math.max(0, Math.round(x + drift + k - smear / 2)));
          const at = (y * width + from) * 4;
          r += source[at]; g += source[at + 1]; b += source[at + 2];
        }
        const edge = 1 - 0.4 * Math.pow(Math.abs(x / width - 0.5) * 2, 3);
        const grain = (rand() - 0.5) * 30;
        const gain = line * shade * edge;
        const at = (y * width + x) * 4;
        data[at] = (r / smear) * gain + grain;
        data[at + 1] = (g / smear) * gain + grain;
        data[at + 2] = (b / smear) * gain + grain;
      }
    }
    ctx.putImageData(image, 0, 0);
  };

  const ground = (ctx, stops) => {
    const { width, height } = ctx.canvas;
    const fill = ctx.createLinearGradient(0, 0, width * 0.3, height);
    stops.forEach(([at, color]) => fill.addColorStop(at, color));
    ctx.fillStyle = fill;
    ctx.fillRect(0, 0, width, height);
  };

  const night = [[0, "#1c0d12"], [0.5, "#3d1522"], [1, "#24101a"]];
  const dusk = [[0, "#3d1522"], [0.55, "#5a2136"], [1, "#1c0d12"]];

  const scenes = [
    {
      name: "bloom",
      size: [1280, 1360],
      seed: 7,
      draw: (ctx, rand, w, h) => {
        ground(ctx, dusk);
        glow(ctx, w * 0.2, h * 0.16, w * 0.7, "rgba(240, 180, 198, 0.45)");
        layer(ctx, 22, (c) => bloom(c, rand, { x: w * 0.92, y: h * 0.94, radius: w * 0.5, turn: 0.4, warmth: 0.15 }));
        layer(ctx, 7, (c) => bloom(c, rand, { x: w * 0.16, y: h * 0.2, radius: w * 0.44, turn: 1.1, tilt: 0.92 }));
        glow(ctx, w * 0.2, h * 0.2, w * 0.3, "rgba(255, 221, 160, 0.16)");
      },
    },
    {
      name: "open",
      size: [1120, 840],
      seed: 21,
      draw: (ctx, rand, w, h) => {
        ground(ctx, night);
        glow(ctx, w * 0.5, h * 0.05, w * 0.6, "rgba(200, 92, 124, 0.35)");
        layer(ctx, 16, (c) => bloom(c, rand, { x: w * 0.08, y: h * 0.95, radius: w * 0.36, turn: 0.2 }));
        layer(ctx, 6, (c) => bloom(c, rand, { x: w * 0.86, y: h * 0.8, radius: w * 0.3, turn: 2, tilt: 0.8 }));
      },
    },
    {
      name: "route",
      size: [1120, 840],
      seed: 33,
      draw: (ctx, rand, w, h) => {
        ground(ctx, dusk);
        layer(ctx, 12, (c) => bloom(c, rand, { x: w * 0.5, y: h * 1.04, radius: w * 0.5, turn: 0.7, warmth: 0.4 }));
        glow(ctx, w * 0.5, h * 0.9, w * 0.5, "rgba(232, 139, 94, 0.28)");
        layer(ctx, 14, (c) => bloom(c, rand, { x: w * 0.08, y: h * 0.1, radius: w * 0.18, turn: 1.5, tilt: 0.7 }));
      },
    },
    {
      name: "connect",
      size: [1120, 840],
      seed: 48,
      draw: (ctx, rand, w, h) => {
        ground(ctx, night);
        glow(ctx, w * 0.82, h * 0.2, w * 0.6, "rgba(240, 180, 198, 0.4)");
        layer(ctx, 6, (c) => bloom(c, rand, { x: w * 0.86, y: h * 0.16, radius: w * 0.34, turn: 0.9, tilt: 0.9 }));
        layer(ctx, 18, (c) => bloom(c, rand, { x: w * 0.02, y: h * 0.72, radius: w * 0.3, turn: 2.4, warmth: 0.3 }));
      },
    },
    {
      name: "field",
      size: [2560, 800],
      seed: 64,
      draw: (ctx, rand, w, h) => {
        ground(ctx, [[0, "#1c0d12"], [0.45, "#3d1522"], [0.75, "#7a2e4a"], [1, "#24101a"]]);
        glow(ctx, w * 0.5, h * 0.62, w * 0.42, "rgba(255, 214, 170, 0.3)");
        layer(ctx, 9, (c) => {
          for (let i = 0; i < 9; i++) {
            bloom(c, rand, {
              x: w * (0.04 + i * 0.115) + (rand() - 0.5) * w * 0.03,
              y: h * (0.78 + rand() * 0.2),
              radius: h * (0.26 + rand() * 0.2),
              turn: rand() * 6,
              tilt: 0.62,
              warmth: rand() * 0.3,
            });
          }
        });
        layer(ctx, 26, (c) => bloom(c, rand, { x: w * 0.95, y: h * 0.02, radius: h * 0.62, turn: 1 }));
        layer(ctx, 26, (c) => bloom(c, rand, { x: w * 0.03, y: h * 0.0, radius: h * 0.5, turn: 2 }));
      },
    },
  ];

  const save = new URLSearchParams(location.search).has("save");
  const out = document.getElementById("out");

  (async () => {
    for (const scene of scenes) {
      const [width, height] = scene.size;
      const canvas = Object.assign(document.createElement("canvas"), { width, height });
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const rand = random(scene.seed);
      scene.draw(ctx, rand, width, height);
      develop(ctx, rand, 1);
      const blob = await new Promise((done) => canvas.toBlob(done, "image/jpeg", 0.86));
      const figure = document.createElement("figure");
      const link = Object.assign(document.createElement("a"), {
        download: `${scene.name}.jpg`,
        href: URL.createObjectURL(blob),
        textContent: `${scene.name}.jpg (${width}×${height})`,
      });
      figure.append(canvas, link);
      out.append(figure);
      if (save) {
        await fetch(`/${scene.name}.jpg`, { body: blob, method: "PUT" });
      }
    }
    document.title = "done";
  })();
</script>
